syntax = "proto3";

package meshtastic;

import "nanopb.proto";

option csharp_namespace = "Meshtastic.Protobufs";
option go_package = "github.com/meshtastic/go/generated";
option java_outer_classname = "X3dhProtos";
option java_package = "org.meshtastic.proto";
option swift_prefix = "";
option (nanopb_fileopt).include = "<vector>";

message OneTimePreKey {
    
    /*
     * Random, unique key-ID allowing matching of private and public key
     */
    uint32 id = 1;

    /*
     * Id of node this key was sent to
     */
    optional uint32 node_num = 2;

    /*
     * 32-byte Ecliptic (X25519) key
     * Public for device-to-device communication, private for on-device-storage
     */
    bytes key = 3;
}

message X3DHMessage {
    
    X3DHMessageType type = 1;

    optional X3DHProtocol continue_protocol = 2;

    /*
     * Number of the external node holding the key bundle
     */
    optional uint32 node_num = 3;

    /*
     * Matching public key to the node number
     */
    optional bytes identity_key = 4;

    /*
     * 32-byte Ecliptic (X25519) key, rotated occasionally
     */
    optional bytes signed_pre_key = 5;

    /*
     * 64 byte signature of the pre-key, signed by the identity key
     */
    optional bytes pre_key_signature = 6;

    /*
     * One Ecliptic (X25519) key, only used once
     */
    optional OneTimePreKey one_time_pre_key = 7;

    /*
     * Public, ephermal key used by the sending node for this X3DH
     */
    optional bytes ephermal_key = 8;

    /*
     * Unique id of the used one-time pre key, so the receiving node can use the correct matching private one
     */
    optional uint32 otpk_id = 9;

    /*
     * Initial cyphertext containing e.g. further secrets for future protocol usage
     */
    optional bytes initial_cyphertext = 10;

    /*
     * Nonce for initial cyphertext
     */
    optional bytes nonce = 11;

    /*
     * Multiple one-time pre-keys, amount only limited by the available size per mesh packet
     */
    repeated OneTimePreKey one_time_pre_keys = 12;
}

enum X3DHMessageType {
    /*
     * Init type for checks
     */
    NOT_SET = 0;

     /*
     * Request pre-key bundle form client or server
     */
    REQUEST_BUNDLE = 1;

    /*
     * Answer with pre-key bundle
     */
    RESPONSE_BUNDLE = 2;

    /*
     * Answer with device id holding client pre-key bundles
     */
    EXTERNAL_BUNDLE = 3;

    /*
     * Initial message containing shared secrets
     */
    INITIAL_MESSAGE = 4;
        
    /*
     * Confirming Message to acceptance of shared secrets with follow-up protocol or protocol upgrade
     */
    PROTOCOL_SWITCH = 5;

    /*
     * Storage request for pre-keys to external server
     */
    STORE_BUNDLE = 6;

    /*
     * Storage request for one-time-pre-keys
     */
    STORE_OTK = 7;

    /*
     * Server request for new one-time-pre-keys from client
     */
    REFILL_OTK = 8;

    /*
     * General error, resets protocol exchange
     */
    X3DH_ERROR = 9;

}

/*
 * Used for determining the post-X3DH-Protocol.
 * Evaluated when PROTOCOL_SWITCH is set or used for announcing capabilities in INITIAL_MESSAGE
 */
enum X3DHProtocol {

    /*
     * More secure than direct ECDH, but still not recommend by the X3DH documentation
     */
    X3DH_SECRET = 0;

    /*
     * Secure with forward secrecy, but needs additional modules and changes to the base system
     */
    DOUBLE_RATCHET = 1;
}

/*
 * Signals the current state of the X3DH-Agreement
 */
 enum X3DHState {
    /*
     * X3DH-Agreement has not benn started
     */
    
    X3DH_NOT_STARTED = 0;

    /*
     * Initial pre-key-bundle requested
     */
    BUNDLE_REQUESTED = 1;

    /*
     * Initial pre-key-bundle sent
     */
    BUNDLE_SENT = 2;

    /*
     * Bundle requested from external server
     */
    EXTERNAL_BUNDLE_REQUESTED = 3;

    /*
     * Pre-key-bundle received
     */
    BUNDLE_RECEIVED = 4;

    /*
     * Initial message sent
     */
    INIT_SENT = 5;

    /*
     * Post-X3DH protocol set, end of X3DH-Agreement
     */
    PROTOCOL_SET = 6;
 }

 message X3DHNodeInfo {
    uint32 node_num = 1;

    X3DHState x3dh_state = 2;

    optional bytes x3dh_shared_key = 3;
 }

 message PreKeyStorage {

    /*
     * NodeNum of pre-key-bundle for further correct handeling
     */
    optional uint32 node_num = 1;

    /*
     * 32-byte XEdDSA key, used for creating the pre-key signature
     */
    bytes identity_key = 2;

    /*
     * 32-byte Ecliptic (X25519) key, rotated occasionally
     */
    bytes signed_pre_key = 3;

    /*
     * 64 byte signature of the pre-key, signed by the identity key
     */
    bytes pre_key_signature = 4;

    /*
     * One or multiple Ecliptic (X25519) keys, only used once
     */
    repeated OneTimePreKey one_time_pre_keys = 5;
}

message X3DHStateDB {
    uint32 node_count = 1;

    repeated X3DHNodeInfo node_info = 2;
}